# HEXSign / OpenSign stack — reconstructed definition of what is actually running.
# There was no compose file on the box: the containers were started with `docker run`.
# This file records the real shape so the stack can be rebuilt identically.
#
# Secrets live OUTSIDE git: deploy/opensign.env (gitignored) - copy it from opensign.env.example.
# Usage:
#   cp deploy/opensign.env.example deploy/opensign.env && vi deploy/opensign.env
#   docker compose -f deploy/opensign-stack.yml up -d
#
# Documents live in the opensign-files volume (mounted at /usr/src/app/files), so they
# survive container recreates and can be read by the drive-sync sidecar.
# EXISTING INSTALLS: the volume is empty on first `up` — copy the old files in first:
#   docker cp opensign-server:/usr/src/app/files/. /tmp/files-backup/   # before recreating
#   docker cp /tmp/files-backup/. opensign-server:/usr/src/app/files/   # after
# See docs/DRIVE.md for the cloud-drive mirror and docs/INSTALL.md for migration.

services:
  opensign-mongo:
    container_name: opensign-mongo
    image: mongo:6
    command: mongod
    restart: unless-stopped
    volumes:
      - opensign-data:/data/db
      - opensign-configdb:/data/configdb
    networks: [opensign-net]

  opensign-server:
    container_name: opensign-server
    # public upstream by default; override for your own build
    image: ${OPENSIGN_SERVER_IMAGE:-opensign/opensignserver:main}
    command: npm start
    restart: unless-stopped
    depends_on: [opensign-mongo]
    env_file:
      - ./opensign.env
    ports:
      - "8588:8080"
    volumes:
      - opensign-files:/usr/src/app/files
    networks: [opensign-net]

  opensign-client:
    container_name: opensign-client
    image: ${OPENSIGN_CLIENT_IMAGE:-opensign/opensign:main}
    command: npm start
    restart: unless-stopped
    env_file:
      - ./opensign.env
    networks: [opensign-net]

  # Optional: mirror stored documents into Google Drive / a Shared drive.
  # Enable with:  docker compose --profile drive -f deploy/opensign-stack.yml up -d
  drive-sync:
    container_name: opensign-drive-sync
    build:
      context: ..
      dockerfile: deploy/drive-sync/Dockerfile
    image: hexsign/drive-sync:latest
    restart: unless-stopped
    profiles: ["drive"]
    env_file:
      - ./opensign.env
    environment:
      DRIVE_SOURCE: /data/files
    volumes:
      - opensign-files:/data/files:ro
      - ${DRIVE_CREDENTIALS_DIR:-./credentials}:/credentials:ro
    networks: [opensign-net]

  opensign-mailpit:
    container_name: opensign-mailpit
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8587:8025"
    volumes:
      - mailpit-data:/data
    networks: [opensign-net]

volumes:
  opensign-files:
  opensign-data:
    name: opensign-stack_opensign-data
  opensign-configdb:
    name: opensign-stack_opensign-configdb
  mailpit-data:
    name: opensign-stack_mailpit-data

networks:
  opensign-net:
    name: opensign-stack_opensign-net
